<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumb OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Public+Sans:ital,wght@0,300..800;1,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#17151A; --bench:#1C1A21; --panel:#211E27; --rail:#2A2731; --line:#332F3B;
  --proof:#7F7F7F; --ink:#F2EDE7; --mute:#9C949E; --dim:#6A6270;
  --hot:#E8705C; --ok:#8FC79A; --warn:#D9AC6B;
  --r:3px;
  --serif:'Fraunces',Georgia,serif;
  --sans:'Public Sans',system-ui,sans-serif;
  --type:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; line-height:1.5; font-weight:350;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
::selection{background:var(--ink);color:var(--void)}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}

/* ---------- primitives ---------- */
.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}
.type{font-family:var(--type)}
.lbl{font-family:var(--serif);font-style:italic;font-size:12.5px;font-weight:400;
  letter-spacing:0;text-transform:none;color:var(--mute);display:inline-block}
.dimtxt{color:var(--mute)}
.h1{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:-.015em;line-height:1.18;
  font-variation-settings:'opsz' 100}
.h2{font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:-.01em}
.h3{font-family:var(--serif);font-size:15px;font-weight:600}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}

.btn{border:1px solid var(--line);padding:6px 13px;border-radius:var(--r);font-size:13px;font-weight:500;
  transition:background .14s,border-color .14s,color .14s;white-space:nowrap}
.btn:hover{border-color:var(--mute);background:#ffffff0a}
.btn.solid{background:var(--ink);color:var(--void);border-color:var(--ink);font-weight:600}
.btn.solid:hover{background:#fff;border-color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed}

input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;background:#00000030;border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;font-size:13.5px;font-weight:350}
input:focus,select:focus,textarea:focus{border-color:var(--mute);outline:none;background:#00000055}
textarea{resize:vertical;min-height:66px;line-height:1.55}
label.f{display:block;margin-bottom:11px}
label.f > span{display:block;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px}
.stack>*+*{margin-top:13px}

.chip{font-size:11.5px;font-weight:450;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);padding:2px 8px;border-radius:9px;color:var(--mute);white-space:nowrap}
.chip.on{color:var(--void);background:var(--ink);border-color:var(--ink);font-weight:600}
.chip.b{cursor:pointer}
.chip.b:hover{color:var(--ink);border-color:var(--mute)}
.chip.on.b:hover{color:var(--void)}

.tick{appearance:none;width:16px;height:16px;border:1px solid var(--line);border-radius:var(--r);
  flex:0 0 auto;cursor:pointer;position:relative;background:#00000040}
.tick:checked{background:var(--ink);border-color:var(--ink)}
.tick:checked::after{content:'';position:absolute;left:5px;top:1px;width:4px;height:9px;
  border:solid var(--void);border-width:0 2px 2px 0;transform:rotate(42deg)}

/* ---------- frame ---------- */
#app{display:grid;grid-template-columns:224px 1fr;height:100vh}
#rail{background:var(--bench);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.02em;display:block;
  font-variation-settings:'opsz' 120}
.brand .lbl{font-size:12px;margin-top:1px}
.sysgrp{padding:16px 0 6px}
.sysgrp > .lbl{padding:0 18px 8px;display:block}
.nav{display:block;width:100%;text-align:left;padding:6px 18px;color:var(--mute);font-size:13.5px;
  font-weight:400;position:relative}
.nav:hover{color:var(--ink)}
.nav.on{color:var(--ink);font-weight:600}
.nav.on::before{content:'';position:absolute;left:8px;top:50%;width:4px;height:4px;margin-top:-2px;
  border-radius:50%;background:var(--ink)}
.nav .n{display:none}
.railfoot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line)}

#main{overflow-y:auto;scroll-behavior:smooth}
.bar{position:sticky;top:0;z-index:20;background:var(--void);border-bottom:1px solid var(--line);
  padding:10px 26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.bar .rd{display:flex;gap:6px;align-items:baseline}
.bar .rd .lbl{font-size:12px}
.bar .rd b{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}
.wrapv{padding:26px;max-width:1200px}
.head{margin-bottom:22px}
.head p{color:var(--mute);font-size:14px;margin-top:7px;max-width:64ch;font-weight:350}

/* ---------- brain ---------- */
.sig{border:1px solid var(--line);border-left:2px solid var(--ink);padding:14px 16px;background:var(--panel)}
.sig q{font-family:var(--serif);font-size:19px;font-weight:500;display:block;quotes:none;line-height:1.3}
.tasks{list-style:none}
.tasks li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:none}
.tasks li.done > span{color:var(--dim);text-decoration:line-through}
.tasks li > span{flex:1;font-size:13.5px}
.meter{height:2px;background:var(--rail);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.wk{border:1px solid var(--line);margin-bottom:9px;background:var(--panel)}
.wk > button{width:100%;display:flex;gap:14px;align-items:center;padding:13px 16px;text-align:left}
.wk .num{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--dim);width:24px}
.wk.open .num{color:var(--ink)}
.wk .ttl{flex:1;font-family:var(--serif);font-weight:600;font-size:15.5px}
.wk .body{padding:0 16px 18px 54px;display:none}
.wk.open .body{display:block}
.wk.open{border-color:var(--mute)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:13px}
.rcard{border:1px solid var(--line);background:var(--panel);cursor:pointer;overflow:hidden;border-radius:var(--r)}
.rcard:hover{border-color:var(--mute)}
.rcard .th{aspect-ratio:16/9;background:var(--proof);display:block;width:100%;object-fit:cover}
.rcard .meta{padding:9px 11px}
.rcard .meta b{display:block;font-family:var(--serif);font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-family:var(--serif);font-style:italic;font-size:12.5px;
  color:var(--mute);font-weight:400;padding:0 12px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:hover td{background:#ffffff05}

.note{border:1px solid var(--line);background:var(--panel);padding:12px 15px;margin-bottom:9px;border-radius:var(--r)}
.note p{font-size:13.5px;white-space:pre-wrap;margin-top:6px}

.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--mute);font-size:13.5px}
.empty b{display:block;color:var(--ink);font-family:var(--serif);font-weight:600;margin-bottom:6px;font-size:16px}

/* ---------- mesa de luz ---------- */
.lab{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.stage{background:var(--proof);border:1px solid var(--line);padding:24px;display:flex;
  align-items:center;justify-content:center;min-height:300px;position:relative}
.stage canvas,.stage img{max-width:100%;display:block;box-shadow:0 2px 26px #0007}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:11px;margin-top:13px}
.sheet figure{background:var(--proof);padding:9px;border:1px solid var(--line)}
.sheet figure canvas{width:100%;display:block}
.sheet figcaption{font-family:var(--serif);font-style:italic;font-size:12px;color:#2c2c2c;margin-top:7px}
.drop{border:1px dashed var(--line);padding:38px 20px;text-align:center;background:var(--panel)}
.drop.over{border-color:var(--ink);background:#ffffff0d}

.score{display:flex;align-items:baseline;gap:9px}
.score b{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{color:var(--mute);font-size:14px}
.bars{list-style:none}
.bars li{padding:7px 0;border-bottom:1px solid var(--line)}
.bars .t{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.bars .t i{font-style:normal;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.bars .g{height:4px;display:flex;gap:3px}
.bars .g span{flex:1;background:#2e2b35}
.bars .g span.f{background:var(--ink)}
.diag li{list-style:none;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;display:flex;gap:11px}
.diag li .k{font-family:var(--serif);font-style:italic;font-size:12px;padding-top:2px;flex:0 0 52px}
.diag .up .k{color:var(--ok)} .diag .down .k{color:var(--hot)} .diag .mid .k{color:var(--warn)}
.diag li em{font-style:italic;font-family:var(--serif);color:var(--mute);display:block;margin-top:3px;font-size:12.5px}
.sw{display:flex;height:36px;border:1px solid var(--line)}
.sw div{flex:1;position:relative}
.sw div span{position:absolute;bottom:-17px;left:0;font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.ctx{background:#0f0f0f;padding:11px;display:flex;gap:10px;border:1px solid var(--line)}
.ctx.light{background:#fff}
.ctx .sug{flex:1}
.ctx .sug .it{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}
.ctx .sug .it .ph{width:100px;height:56px;background:#2a2a2a;flex:0 0 auto}
.ctx.light .sug .it .ph{background:#e2e2e2}
.ctx .sug .it .ln{flex:1}
.ctx .sug .it .ln i{display:block;height:7px;background:#2a2a2a;margin-bottom:5px}
.ctx.light .sug .it .ln i{background:#e2e2e2}
.ctx .sug .it.me .ph{background:#000;padding:0}
.ctx canvas{display:block}

.modal{position:fixed;inset:0;background:#000d;z-index:60;display:flex;align-items:flex-start;
  justify-content:center;padding:42px 20px;overflow-y:auto}
.modal .sheetbox{background:var(--bench);border:1px solid var(--line);width:100%;max-width:740px;border-radius:var(--r)}
.modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .bd{padding:20px}
.modal footer{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--void);
  padding:9px 18px;font-size:13px;font-weight:600;z-index:80;border-radius:20px}

.spark{display:flex;align-items:flex-end;gap:3px;height:38px}
.spark i{flex:1;background:var(--rail);min-height:2px}
.spark i.hi{background:var(--ink)}

/* ---------- leitura simplificada (cliente) ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{padding:6px 15px;font-size:12.5px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--ink);color:var(--void);font-weight:650}

.gauge{position:relative;width:132px;height:132px;flex:0 0 auto}
.gauge svg{transform:rotate(-90deg)}
.gauge .val{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .val b{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.gauge .val span{font-size:11px;color:var(--mute);margin-top:1px}
.gauge.sm{width:84px;height:84px}
.gauge.sm .val b{font-size:23px}
.gauge.sm .val span{font-size:10px}

.verdict{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.verdict>div{min-width:0;flex:1 1 300px}
.verdict .vt{font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.25;margin-top:9px}
.verdict p{color:var(--mute);font-size:13px;margin-top:7px;max-width:60ch}

.tagst{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;white-space:nowrap;display:inline-block}
.tagst.ok{background:#8FC79A22;color:var(--ok)}
.tagst.warn{background:#D9AC6B22;color:var(--warn)}
.tagst.hot{background:#E8705C22;color:var(--hot)}

.track{position:relative;height:7px;background:#2e2b35;border-radius:99px;margin-top:8px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;display:block}
.track .tgt{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.8;border-radius:2px}
.g-ok{background:var(--ok)} .g-warn{background:var(--warn)} .g-hot{background:var(--hot)}

.pill{padding:12px 0;border-bottom:1px solid var(--line)}
.pill:last-child{border-bottom:none;padding-bottom:2px}
.pill .hd{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill .hd b{font-size:14px;font-weight:600}
.pill .hd i{font-style:normal;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.pill .q{font-size:12px;color:var(--dim);margin-top:2px}
.pill .ms{font-size:12.5px;color:var(--mute);margin-top:7px}

.grow{display:grid;grid-template-columns:minmax(0,1fr) 128px 170px 62px;gap:14px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:none}
.grow>*{min-width:0}
.grow .gn b{font-size:13.5px;font-weight:600;display:block;overflow-wrap:anywhere}
.grow .gn em{font-style:normal;font-size:11.5px;color:var(--dim);display:block;margin-top:2px;line-height:1.4}
.grow .gv .now{display:block;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.grow .gv .tg{display:block;font-size:11.5px;color:var(--mute);margin-top:1px}
.grow .gb .track{margin-top:0}
.grow .gs{text-align:right}

.fixit>div{min-width:0}
.fixit{display:flex;gap:13px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.fixit:last-child{border-bottom:none;padding-bottom:2px}
.fixit .fxn{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--dim);width:22px;flex:0 0 auto;line-height:1.1}
.fixit>div>b{font-size:14px;display:block}
.fixit .fxline{font-size:12px;color:var(--mute);margin-top:6px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fixit p{font-size:13px;margin-top:7px}
.fixit p.sub{color:var(--mute);font-size:12.5px;margin-top:4px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tiles>*{min-width:0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tile .im{background:var(--proof);padding:10px;display:flex;align-items:center;justify-content:center;min-height:120px}
.tile canvas{max-width:100%;display:block}
.tile .cp{padding:9px 11px}
.tile .cp b{display:block;font-size:12.5px;font-weight:600}
.tile .cp span{display:block;font-size:11.5px;color:var(--mute);margin-top:3px;line-height:1.45}

.abgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.abgrid>*{min-width:0}
.abcol{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);overflow:hidden}
.abcol .abh{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.abcol .abh b{font-family:var(--serif);font-size:15px;font-weight:600}
.abcol .abi{background:var(--proof);padding:11px}
.abcol .abi canvas,.abcol .abi img{width:100%;display:block}
.abcol .abb{padding:13px 14px}
.abwin{border:1px solid var(--line);border-left:2px solid var(--ok);background:var(--panel);
  padding:13px 16px;border-radius:var(--r);margin-bottom:14px}
.abwin b{font-family:var(--serif);font-size:16px;font-weight:600}
.abwin p{font-size:13px;color:var(--mute);margin-top:5px}

details.fold{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:0}
details.fold>summary{padding:12px 16px;cursor:pointer;font-size:13px;font-weight:600;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'+ ';color:var(--mute)}
details.fold[open]>summary::before{content:'– '}
details.fold .fb{padding:0 16px 16px}

.evo{width:100%;height:66px;display:block}

@media (max-width:900px){
  .grow{grid-template-columns:1fr auto;gap:6px 12px}
  .grow .gn{grid-column:1/3}
  .grow .gb{grid-column:1/3}
  .grow .gs{grid-column:2;grid-row:2;text-align:right}
  .grow .gv{grid-column:1;grid-row:2}
  .abgrid{grid-template-columns:1fr}
  .verdict{flex-direction:column;align-items:flex-start;gap:14px}
}

@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #rail{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);align-items:center}
  .brand,.railfoot{display:none}
  .sysgrp{display:flex;align-items:center;padding:6px 0}
  .sysgrp > .lbl{padding:0 12px;white-space:nowrap}
  .nav{white-space:nowrap;padding:11px 13px}
  .nav.on::before{left:50%;top:auto;bottom:4px;margin-left:-2px}
  .lab{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .wrapv{padding:16px}
  .h1{font-size:23px}
  .bar{padding:8px 16px;gap:12px}
  .stage{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="brand"><b>Thumb OS</b><span class="lbl">caderno de bancada</span></div>
    <div class="sysgrp" id="nav1"><div class="lbl">Sistema 01 · Cérebro</div></div>
    <div class="sysgrp" id="nav2"><div class="lbl">Sistema 02 · Mesa de luz</div></div>
    <div class="railfoot">
      <button class="btn sm" style="width:100%" onclick="App.exportAll()">Exportar backup</button>
      <button class="btn sm ghost" style="width:100%;margin-top:6px" onclick="App.importAll()">Importar backup</button>
      <p class="lbl" id="storeInfo" style="font-size:11px;margin-top:9px;line-height:1.4"></p>
    </div>
  </nav>
  <main id="main">
    <div class="bar" id="bar"></div>
    <div class="wrapv" id="view"></div>
  </main>
</div>
<div id="layer"></div>
<script>
/* ============================================================
   Thumb OS — núcleo: estado, armazenamento, conteúdo, roteador
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,9);
const today = ()=>new Date().toISOString().slice(0,10);
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fmt = d => d ? new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) : '—';

/* ---------- camada de armazenamento portátil ----------
   Ordem de tentativa: runtime do Claude → IndexedDB → localStorage.
   O app funciona igual nos três; muda só onde os dados moram. */
const Store = (function(){
  if(window.storage) return Object.assign({mode:'claude'}, window.storage);

  // IndexedDB: cota alta (centenas de MB), ideal para o banco de imagens
  function makeIDB(){
    const dbp = new Promise((res,rej)=>{
      let r;
      try{ r = indexedDB.open('thumb-os',1); }catch(e){ return rej(e); }
      r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
      r.onsuccess = ()=> res(r.result);
      r.onerror   = ()=> rej(r.error);
      r.onblocked = ()=> rej(new Error('blocked'));
    });
    const tx=(mode,fn)=>dbp.then(db=>new Promise((res,rej)=>{
      const t=db.transaction('kv',mode), st=t.objectStore('kv'), rq=fn(st);
      t.oncomplete=()=>res(rq?rq.result:undefined); t.onerror=()=>rej(t.error);
    }));
    return {mode:'indexeddb', probe:dbp,
      get:k=>tx('readonly',s=>s.get(k)).then(v=> v===undefined?null:{key:k,value:v}),
      set:(k,v)=>tx('readwrite',s=>s.put(v,k)).then(()=>({key:k,value:v})),
      delete:k=>tx('readwrite',s=>s.delete(k)).then(()=>({key:k,deleted:true})),
      list:()=>tx('readonly',s=>s.getAllKeys()).then(keys=>({keys}))};
  }
  // localStorage: ~5 MB. Suficiente para o texto, apertado para muitas imagens.
  const LS = {mode:'localstorage',
    get:k=>Promise.resolve(localStorage.getItem(k)===null?null:{key:k,value:localStorage.getItem(k)}),
    set:(k,v)=>{ localStorage.setItem(k,v); return Promise.resolve({key:k,value:v}); },
    delete:k=>{ localStorage.removeItem(k); return Promise.resolve({key:k,deleted:true}); },
    list:()=>Promise.resolve({keys:Object.keys(localStorage)})};

  try{
    const idb = makeIDB();
    idb.probe.catch(()=>{});      // se falhar, o DB abaixo cai no fallback
    return idb;
  }catch(e){ return LS; }
})();
const STORE_FALLBACK = {
  set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){ throw e; } },
  get:k=>localStorage.getItem(k)
};

/* ---------- armazenamento persistente ---------- */
const DB = {
  cache:{}, dirty:new Set(), timer:null,
  async load(key, fallback){
    if(key in this.cache) return this.cache[key];
    try{ let r = await Store.get(key);
         if(r===null && Store.mode==='indexeddb'){ const l=STORE_FALLBACK.get(key); if(l!==null) r={value:l}; }
         this.cache[key] = r ? JSON.parse(r.value) : fallback; }
    catch(e){ this.cache[key] = fallback; }
    return this.cache[key];
  },
  get(key, fallback){ return (key in this.cache) ? this.cache[key] : fallback; },
  set(key, val){ this.cache[key]=val; this.dirty.add(key); this.queue(); },
  queue(){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),600); },
  async flush(){
    const keys=[...this.dirty]; this.dirty.clear();
    for(const k of keys){
      const payload = JSON.stringify(this.cache[k]);
      try{ await Store.set(k, payload); }
      catch(e){
        try{ STORE_FALLBACK.set(k, payload); }
        catch(e2){ toast('Armazenamento cheio — exporte um backup e apague referências antigas'); }
      }
    }
  },
  async del(key){ delete this.cache[key]; try{ await Store.delete(key); }catch(e){} }
};

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2200);
}
async function copyText(txt,label){
  try{ await navigator.clipboard.writeText(txt); toast((label||'Texto')+' copiado'); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast((label||'Texto')+' copiado');
  }
}

/* ---------- modal ---------- */
function modal(title, body, actions){
  const l=$('#layer');
  l.innerHTML=`<div class="modal"><div class="sheetbox">
    <header><b class="h2">${esc(title)}</b><button class="btn sm ghost" onclick="closeModal()">Fechar</button></header>
    <div class="bd">${body}</div>
    <footer>${actions||'<button class="btn" onclick="closeModal()">Fechar</button>'}</footer></div></div>`;
  l.querySelector('.modal').onclick=e=>{ if(e.target.classList.contains('modal')) closeModal(); };
}
function closeModal(){ $('#layer').innerHTML=''; }

/* ---------- imagens ---------- */
function fileToImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function imgToData(img, maxW, q){
  const c=document.createElement('canvas');
  const s=Math.min(1, maxW/img.width);
  c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg', q||.72);
}
function loadData(src){ return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; }); }

async refSave(id){
  const refs=DB.get(K.refs,[]);
  const cur = id? refs.find(r=>r.id===id) : null;

    url:$('#rf_url').value.trim(), enq:$('#rf_enq').value, pos:$('#rf_pos').value, emo:$('#rf_emo').value,
    fundo:$('#rf_fundo').value, words:$('#rf_words').value===''?null:+$('#rf_words').value,
    subs:$('#rf_subs').value.trim(), tags:$('#rf_tags').value.split(',').map(s=>s.trim()).filter(Boolean),
    obs:$('#rf_obs').value.trim(), date:cur?cur.date:today(),
    score:cur?cur.score:null, palette:cur?cur.palette:null };
  if(cur) Object.assign(cur,obj); else refs.unshift(obj);
  DB.set(K.refs,refs); closeModal(); renderBar(); Brain.refs(); toast('Referência salva');

/* ---------------- ANATOMIA DE NICHOS ---------------- */
nichos(){
  const refs=DB.get(K.refs,[]);
  const groups={};
  refs.forEach(r=>{ (groups[r.nicho]=groups[r.nicho]||[]).push(r); });
  const mode=(arr,k)=>{ const c={}; arr.forEach(r=>{ if(r[k]) c[r[k]]=(c[r[k]]||0)+1; });
    const e=Object.entries(c).sort((a,b)=>b[1]-a[1]); return e.length? e : null; };
  const bar=(e,tot)=>e.slice(0,4).map(([k,v])=>`<div style="margin-bottom:6px">
      <div class="row spread" style="font-size:12px"><span>${esc(k)}</span><i class="mono dimtxt" style="font-style:normal;font-size:11px">${Math.round(v/tot*100)}%</i></div>
      <div class="meter"><i style="width:${v/tot*100}%"></i></div></div>`).join('');

  paint(`<div class="head">
    <h1 class="h1">Anatomia de nichos</h1>
    <p>Gerada a partir dos campos que você preenche em cada referência. Com 3 ou mais refs de um nicho o padrão dominante aparece sozinho. É o entregável da semana 1 — e o que você manda no onboarding de todo cliente novo.</p>
  </div>
  ${Object.keys(groups).length? Object.entries(groups).map(([nid,arr])=>{
    const tot=arr.length;
    const w=arr.filter(r=>r.words!=null).map(r=>r.words);
    const avgW=w.length? (w.reduce((a,b)=>a+b,0)/w.length).toFixed(1):'—';
    const sc=arr.filter(r=>r.score).map(r=>r.score);
    const avgS=sc.length? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length):null;
    const faces=arr.filter(r=>r.emo&&r.emo!=='sem rosto').length;
    const pal=arr.flatMap(r=>r.palette||[]).slice(0,24);
    const nc=NICHOS.find(x=>x.id===nid)||{};
    const th=S.tese&&S.tese[nid]||'';
    return `<div class="card" style="margin-bottom:16px">
      <div class="spread" style="margin-bottom:14px">
        <div><span class="lbl">Tier ${esc(nc.tier||'—')} · ${esc(nc.tick||'')}</span>
          <h2 class="h2" style="margin-top:4px">${esc(nichoName(nid))}</h2></div>
        <div class="row"><span class="chip">${tot} refs</span>${avgS?`<span class="chip">nota média ${avgS}/36</span>`:''}
          <span class="chip">${Math.round(faces/tot*100)}% com rosto</span><span class="chip">${avgW} palavras</span></div>
      </div>
      <div class="grid3" style="gap:0 20px">
        <div><div class="lbl" style="margin-bottom:8px">Enquadramento</div>${mode(arr,'enq')?bar(mode(arr,'enq'),tot):'<p class="dimtxt" style="font-size:12px">sem dados</p>'}</div>
        <div><div class="lbl" style="margin-bottom:8px">Posição do texto</div>${mode(arr,'pos')?bar(mode(arr,'pos'),tot):'<p class="dimtxt" style="font-size:12px">sem dados</p>'}</div>
        <div><div class="lbl" style="margin-bottom:8px">Emoção</div>${mode(arr,'emo')?bar(mode(arr,'emo'),tot):'<p class="dimtxt" style="font-size:12px">sem dados</p>'}</div>
      </div>
      ${pal.length?`<div style="margin-top:16px"><div class="lbl" style="margin-bottom:6px">Paleta agregada do nicho</div>
        <div class="sw" style="height:26px">${pal.map(c=>`<div style="background:${esc(c)}"></div>`).join('')}</div></div>`:''}
      <hr>
      <div class="lbl">Tese do nicho — o que você vai fazer diferente</div>
      <textarea style="margin-top:6px" placeholder="Ex.: todo mundo usa close-up com boca aberta e texto amarelo à esquerda. Vou manter o close-up (funciona) e trocar o amarelo por um acento frio, porque no sugerido desse nicho tudo é quente e nada separa."
        onchange="Brain.tese('${nid}',this.value)">${esc(th)}</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" onclick="Brain.exportAnatomia('${nid}')">Copiar anatomia (para onboarding)</button>
      </div>
    </div>`;
  }).join('') : `<div class="empty"><b>Sem referências ainda</b>A anatomia se monta sozinha conforme você capturar refs e preencher os campos estruturados.</div>`}`);
},
tese(nid,v){ S.tese=S.tese||{}; S.tese[nid]=v; save(); },
exportAnatomia(nid){
  const arr=DB.get(K.refs,[]).filter(r=>r.nicho===nid);
  const top=(k)=>{const c={};arr.forEach(r=>{if(r[k])c[r[k]]=(c[r[k]]||0)+1});
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([x,v])=>`${x} (${Math.round(v/arr.length*100)}%)`).join(', ')||'—'};
  const w=arr.filter(r=>r.words!=null).map(r=>r.words);
  const txt=`ANATOMIA — ${nichoName(nid)}
Base: ${arr.length} referências analisadas.

Enquadramento dominante: ${top('enq')}
Posição do texto: ${top('pos')}
Emoção dominante: ${top('emo')}
Fundo: ${top('fundo')}
Média de palavras no texto: ${w.length?(w.reduce((a,b)=>a+b,0)/w.length).toFixed(1):'—'}

Tese: ${(S.tese&&S.tese[nid])||'—'}`;
  copyText(txt,'Anatomia');
},

/* ============================================================

const Eng = {
  W:480,
  imgData(img){
    const w=this.W, h=Math.round(img.height/img.width*w);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,w,h);
    return {c, w, h, d:x.getImageData(0,0,w,h).data};
  },
  boxBlur(src,w,h,r){
    if(r<1) return src.slice();
    const tmp=new Float32Array(w*h), out=new Float32Array(w*h);
    for(let y=0;y<h;y++){ let acc=0; const o=y*w;
      for(let i=-r;i<=r;i++) acc+=src[o+Math.min(w-1,Math.max(0,i))];
      for(let x=0;x<w;x++){ tmp[o+x]=acc/(2*r+1);
        acc+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)]; } }
    for(let x=0;x<w;x++){ let acc=0;
      for(let i=-r;i<=r;i++) acc+=tmp[Math.min(h-1,Math.max(0,i))*w+x];
      for(let y=0;y<h;y++){ out[y*w+x]=acc/(2*r+1);
        acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]; } }
    return out;
  },
  gauss(src,w,h,r){ let a=this.boxBlur(src,w,h,r); a=this.boxBlur(a,w,h,r); return this.boxBlur(a,w,h,r); },
  normP(a,p){
    const srt=Array.from(a).sort((x,y)=>x-y);
    const hi=srt[Math.floor((srt.length-1)*(p||.995))]||1, lo=srt[Math.floor((srt.length-1)*.02)]||0;
    const o=new Float32Array(a.length), d=(hi-lo)||1;
    for(let i=0;i<a.length;i++) o[i]=Math.max(0,(a[i]-lo)/d);
    return o;
  },
  norm(a){
    let mx=0,mn=1e9; for(let i=0;i<a.length;i++){ if(a[i]>mx)mx=a[i]; if(a[i]<mn)mn=a[i]; }
    const o=new Float32Array(a.length), d=(mx-mn)||1;
    for(let i=0;i<a.length;i++) o[i]=(a[i]-mn)/d;
    return o;
  },
  cs(ch,w,h,pairs){ // center-surround multiescala
    const acc=new Float32Array(w*h);
    pairs.forEach(([a,b])=>{
      const A=this.gauss(ch,w,h,a), B=this.gauss(ch,w,h,b);
      const t=new Float32Array(w*h);
      for(let i=0;i<w*h;i++) t[i]=Math.abs(A[i]-B[i]);
      const n=this.norm(t);
      // peso por "quão pontual" é o mapa: penaliza mapas uniformes
      let mean=0; for(let i=0;i<n.length;i++) mean+=n[i]; mean/=n.length;
      const wgt=(1-mean)*(1-mean);
      for(let i=0;i<w*h;i++) acc[i]+=n[i]*wgt;
    });
    return this.norm(acc);
  },
  sobel(ch,w,h){
    const o=new Float32Array(w*h);
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){
      const i=y*w+x;
      const gx=-ch[i-w-1]-2*ch[i-1]-ch[i+w-1]+ch[i-w+1]+2*ch[i+1]+ch[i+w+1];
      const gy=-ch[i-w-1]-2*ch[i-w]-ch[i-w+1]+ch[i+w-1]+2*ch[i+w]+ch[i+w+1];
      o[i]=Math.sqrt(gx*gx+gy*gy);
    }
    return this.norm(o);
  },
  channels(d,w,h){
    const n=w*h, L=new Float32Array(n), RG=new Float32Array(n), BY=new Float32Array(n),
          SAT=new Float32Array(n), HUE=new Float32Array(n);
    for(let i=0;i<n;i++){
      const r=d[i*4]/255, g=d[i*4+1]/255, b=d[i*4+2]/255;
      L[i]=.299*r+.587*g+.114*b;
      const mx=Math.max(r,g,b), mn=Math.min(r,g,b), dl=mx-mn;
      SAT[i]= mx? dl/mx : 0;
      let hu=0;
      if(dl>1e-4){
        if(mx===r) hu=((g-b)/dl+6)%6; else if(mx===g) hu=(b-r)/dl+2; else hu=(r-g)/dl+4;
        hu*=60;
      }
      HUE[i]=hu;
      RG[i]=Math.abs(r-g); BY[i]=Math.abs(b-(r+g)/2);
    }
    return {L,RG,BY,SAT,HUE};
  },
  saliency(ch,w,h,useColor){
    const pairs=[[1,5],[2,10],[4,18]];
    const I=this.cs(ch.L,w,h,pairs);
    const O=this.cs(this.sobel(this.gauss(ch.L,w,h,1),w,h),w,h,[[2,8],[4,16]]);
    let C=null;
    if(useColor){
      const a=this.cs(ch.RG,w,h,pairs), b=this.cs(ch.BY,w,h,pairs);
      C=new Float32Array(w*h); for(let i=0;i<w*h;i++) C[i]=(a[i]+b[i])/2;
    }
    const s=new Float32Array(w*h);
    for(let i=0;i<w*h;i++) s[i]= useColor? .42*I[i]+.30*C[i]+.28*O[i] : .60*I[i]+.40*O[i];
    // viés central leve (documentado em eye-tracking e reforçado pelo corte do YouTube)
    const cx=w/2, cy=h/2, sx=w*.42, sy=h*.42;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const g=Math.exp(-(((x-cx)**2)/(2*sx*sx)+((y-cy)**2)/(2*sy*sy)));
      s[y*w+x]*= .78+.22*g;
    }
    return this.normP(this.gauss(s,w,h,3),.995);
  },
  peaks(s,w,h,n){
    const a=s.slice(), out=[], r=Math.round(w*.17);
    for(let k=0;k<n;k++){
      let mi=0,mv=-1;
      for(let i=0;i<a.length;i++) if(a[i]>mv){mv=a[i];mi=i}
      if(mv<=0) break;
      const px=mi%w, py=(mi/w)|0;
      out.push({x:px,y:py,v:mv});
      for(let y=Math.max(0,py-r);y<Math.min(h,py+r);y++)
        for(let x=Math.max(0,px-r);x<Math.min(w,px+r);x++){
          const dd=Math.hypot(x-px,y-py); if(dd<r) a[y*w+x]*=Math.min(1,(dd/r)**2);
        }
    }
    return out;
  },
  kmeans(d,w,h,k){
    const pts=[]; const step=Math.max(1,Math.floor((w*h)/4000));
    for(let i=0;i<w*h;i+=step) pts.push([d[i*4],d[i*4+1],d[i*4+2]]);
    let cent=[]; for(let i=0;i<k;i++) cent.push(pts[Math.floor(pts.length*(i+.5)/k)].slice());
    let asg=new Array(pts.length).fill(0);
    for(let it=0;it<10;it++){
      for(let i=0;i<pts.length;i++){
        let bi=0,bd=1e12;
        for(let j=0;j<k;j++){ const c=cent[j];
          const dd=(pts[i][0]-c[0])**2+(pts[i][1]-c[1])**2+(pts[i][2]-c[2])**2;
          if(dd<bd){bd=dd;bi=j} }
        asg[i]=bi;
      }
      const sum=Array.from({length:k},()=>[0,0,0,0]);
      pts.forEach((p,i)=>{const s=sum[asg[i]];s[0]+=p[0];s[1]+=p[1];s[2]+=p[2];s[3]++});
      cent=sum.map((s,j)=> s[3]? [s[0]/s[3],s[1]/s[3],s[2]/s[3]] : cent[j]);
    }
    const cnt=new Array(k).fill(0); asg.forEach(a=>cnt[a]++);
    return cent.map((c,i)=>({hex:'#'+c.map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''),
      share:cnt[i]/pts.length, rgb:c})).sort((a,b)=>b.share-a.share);
  },
  hueMean(idx,HUE,SAT){
    let sx=0,sy=0,tw=0;
    idx.forEach(i=>{ const wgt=SAT[i]; const a=HUE[i]*Math.PI/180; sx+=Math.cos(a)*wgt; sy+=Math.sin(a)*wgt; tw+=wgt; });
    if(tw<1e-3) return null;
    let a=Math.atan2(sy/tw,sx/tw)*180/Math.PI; if(a<0)a+=360;

  },
  pct(arr,p){ const a=Array.from(arr).sort((x,y)=>x-y); return a[Math.floor((a.length-1)*p)]; },

  run(img){
    const {c,w,h,d}=this.imgData(img);

    const sal=this.saliency(ch,w,h,true);

    const pk=this.peaks(sal,w,h,5), pkG=this.peaks(salG,w,h,1);

    const small=document.createElement('canvas'); small.width=168; small.height=Math.round(168*h/w);
    const sx=small.getContext('2d'); sx.imageSmoothingQuality='high'; sx.drawImage(c,0,0,small.width,small.height);
    const back=document.createElement('canvas'); back.width=w; back.height=h;
    const bx=back.getContext('2d',{willReadFrequently:true}); bx.imageSmoothingQuality='high';
    bx.drawImage(small,0,0,w,h);
    const chB=this.channels(bx.getImageData(0,0,w,h).data,w,h);
    const e1=this.sobel(ch.L,w,h), e2=this.sobel(chB.L,w,h);
    let s1=0,s2=0; for(let i=0;i<n;i++){ s1+=e1[i]; s2+=e2[i]; }
    const legib=Math.min(1, s2/Math.max(1e-6,s1));

    const palette=this.kmeans(d,w,h,5);
    const warm=palette.filter(p=>{const [r,g,b]=p.rgb;return r>b}).reduce((a,p)=>a+p.share,0);

    return {c,w,h,sal,salG,pk,palette,warm,
      m:{focus,cov,blobs,shift,lumRange,lumMean,hueDist,lumSep,accent,edgeMass,legib,
         subShare:sub.length/n, satMean:Array.from(ch.SAT).reduce((a,b)=>a+b,0)/n}};
  }
};

const INFERNO=[[0,4],[22,11,57],[66,10,104],[106,23,110],[147,38,103],[188,55,84],[221,81,58],[243,120,25],[252,255,164]];
function inferno(t){
  t=Math.max(0,Math.min(1,t));
  const st=[[0,[0,0,4]],[.13,[22,11,57]],[.25,[66,10,104]],[.38,[106,23,110]],[.5,[147,38,103]],
            [.63,[188,55,84]],[.75,[221,81,58]],[.88,[243,120,25]],[1,[252,255,164]]];
  for(let i=0;i<st.length-1;i++){
    if(t>=st[i][0]&&t<=st[i+1][0]){
      const f=(t-st[i][0])/(st[i+1][0]-st[i][0]);
      return st[i][1].map((v,j)=>Math.round(v+(st[i+1][1][j]-v)*f));
    }
  }
  return st[st.length-1][1];
}

/* ---------- render ---------- */
draw(kind,res,cv,scale){
  const w=res.w,h=res.h, W=cv.width=Math.round(w*(scale||1)), H=cv.height=Math.round(h*(scale||1));
  const x=cv.getContext('2d');
  x.imageSmoothingQuality='high';
  if(kind==='original'){ x.drawImage(res.c,0,0,W,H); return; }
  if(kind==='cinza'){ x.filter='grayscale(1)'; x.drawImage(res.c,0,0,W,H); x.filter='none'; return; }
  if(kind==='blur'){ x.filter='blur('+Math.max(3,Math.round(W*.035))+'px)'; x.drawImage(res.c,0,0,W,H); x.filter='none'; return; }
  if(kind==='calor'){
    x.drawImage(res.c,0,0,W,H);
    x.fillStyle='rgba(8,8,10,.55)'; x.fillRect(0,0,W,H);
    const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
    const tx=tmp.getContext('2d'); const id=tx.createImageData(w,h);
    for(let i=0;i<w*h;i++){
      const v=Math.min(1,res.sal[i]), col=inferno(v);
      id.data[i*4]=col[0]; id.data[i*4+1]=col[1]; id.data[i*4+2]=col[2];
      id.data[i*4+3]=Math.round(Math.pow(v,.72)*236);
    }
    tx.putImageData(id,0,0);
    x.globalAlpha=.92; x.drawImage(tmp,0,0,W,H); x.globalAlpha=1;
    return;
  }
  if(kind==='fixacao'){
    x.drawImage(res.c,0,0,W,H);
    x.fillStyle='rgba(0,0,0,.42)'; x.fillRect(0,0,W,H);
    const s=W/w, pk=res.pk.filter(p=>p.v>.28).slice(0,4);
    x.strokeStyle='rgba(255,255,255,.85)'; x.lineWidth=Math.max(1,W/420); x.setLineDash([5,5]);
    x.beginPath();
    pk.forEach((p,i)=> i? x.lineTo(p.x*s,p.y*s) : x.moveTo(p.x*s,p.y*s));
    x.stroke(); x.setLineDash([]);
    pk.forEach((p,i)=>{
      const r=Math.max(9,W*.026*(0.75+Math.min(1,p.v)*0.55));
      x.beginPath(); x.arc(p.x*s,p.y*s,r,0,7); x.fillStyle='rgba(255,255,255,.94)'; x.fill();
      x.fillStyle='#111'; x.font='700 '+Math.round(r*1.05)+'px Public Sans, system-ui, sans-serif';
      x.textAlign='center'; x.textBaseline='middle'; x.fillText(String(i+1),p.x*s,p.y*s+1);
      x.beginPath(); x.arc(p.x*s,p.y*s,r*2.1,0,7);
      x.strokeStyle='rgba(255,255,255,.28)'; x.lineWidth=1; x.stroke();
    });
    return;
  }
},
drawSmall(res,cv){ cv.width=168; cv.height=Math.round(168*res.h/res.w);
  const x=cv.getContext('2d'); x.imageSmoothingQuality='high'; x.drawImage(res.c,0,0,cv.width,cv.height); },
shot(res,kind,w){
  const cv=document.createElement('canvas');
  if(kind==='small'){ this.drawSmall(res,cv); } else { this.draw(kind,res,cv,(w||660)/res.w); }
  return cv.toDataURL('image/jpeg',.84);
},

  if(slot==='A'){ this.tab='calor'; this.curId=null; }
  this.render();
  toast(slot==='B'?'Versão B analisada':'Análise concluída');
},
setMode(m){ this.mode=m; this.render(); },
clear(){ this.A=null; this.B=null; this.curId=null; this.meta={cliente:'',video:'',nota:''}; this.render(); },
swapAB(){ const t=this.A; this.A=this.B; this.B=t; this.render(); toast('A e B trocados'); },
dropB(){ this.B=null; this.render(); },
promoteB(){ if(!this.B) return; this.A=this.B; this.B=null; this.curId=null; this.render(); toast('B virou a versão principal'); },

render(){
  const A=this.A,B=this.B,man=this.manual;
  const box=$('#lab'); if(!box) return;
  if(!A){
    box.innerHTML=`<div class="drop" id="drop">
      <b class="h2">Solte uma imagem aqui</b>
      <p class="dimtxt" style="font-size:12.5px;margin:8px 0 14px">arraste um arquivo, clique para escolher, ou cole com Ctrl+V</p>
      <input type="file" id="fA" accept="image/*" style="display:none">
      <button class="btn solid" onclick="$('#fA').click()">Escolher arquivo</button>
      <button class="btn" onclick="go('refs')">Usar uma referência do banco</button>
    </div>`;
    this.wire('fA','A'); return;
  }
  const sc=this.score(A,man), scB = B? this.score(B,man) : null;
  box.innerHTML = this.toolbar(B) + (this.mode==='tec'
      ? this.techHTML(A,B,sc,scB)
      : this.simpleHTML(A,B,sc,scB));
  this.paintCanvas();
  this.wire('fA2','A'); this.wire('fB','B');
},

toolbar(B){
  return `<div class="row wrap" style="margin-bottom:16px;gap:8px">
    <div class="seg">
      <button class="${this.mode==='resumo'?'on':''}" onclick="Lab.setMode('resumo')">Resumo pro cliente</button>
      <button class="${this.mode==='tec'?'on':''}" onclick="Lab.setMode('tec')">Leitura técnica</button>
    </div>
    <div style="flex:1"></div>
    <button class="btn sm" onclick="$('#fA2').click()">Trocar A</button>
    <button class="btn sm" onclick="$('#fB').click()">${B?'Trocar B':'+ versão B'}</button>
    ${B?`<button class="btn sm ghost" onclick="Lab.swapAB()">A ↔ B</button>`:''}
    <button class="btn sm" onclick="Lab.exportForm()">Exportar</button>
    <button class="btn sm solid" onclick="Lab.save()">${this.curId?'Atualizar':'Salvar'}</button>
    <button class="btn sm ghost" onclick="Lab.clear()">Limpar</button>
    <input type="file" id="fA2" accept="image/*" style="display:none">
    <input type="file" id="fB" accept="image/*" style="display:none">
  </div>`;
},

/* ================= MODO RESUMO ================= */
simpleHTML(A,B,sc,scB){
  const P=this.pillarData(sc), G=this.gauges(A), V=this.verdictText(sc.total);
  const pri=this.priorities(sc), str=this.strengths(sc), risk=this.riskLine(P);

  const veredito=`<div class="card" style="margin-bottom:14px">
    <div class="verdict">
      ${this.gaugeSVG(sc.total,36)}
      <div>
        <span class="tagst ${V.s}">${V.t}</span>
        ${scB?`<span class="tagst ${scB.total>sc.total?'ok':scB.total<sc.total?'hot':'warn'}" style="margin-left:6px">versão B: ${scB.total}/36 (${scB.total-sc.total>=0?'+':''}${scB.total-sc.total})</span>`:''}
        <div class="vt">${esc(A.name||'Thumb')}</div>
        <p>${V.p}</p>
        <div class="row wrap" style="margin-top:11px;gap:7px">
          <span class="chip">risco de passar batido: <b style="margin-left:4px">${risk.v}</b></span>
          <span class="chip">${P.filter(p=>p.s==='ok').length} de 4 blocos no alvo</span>
          <span class="chip">${sc.items.filter(i=>i.s<=1).length} pontos críticos</span>
        </div>
        <p style="font-size:12.5px;margin-top:9px">${risk.p}</p>
      </div>
    </div>
  </div>`;

  const pilares=`<div class="card" style="margin-bottom:14px">
    <div class="spread"><div class="lbl">Os 4 blocos que decidem o clique</div>
      <span class="dimtxt" style="font-size:11px">a marca vertical é o mínimo aceitável</span></div>
    <div style="margin-top:4px">
    ${P.map(p=>`<div class="pill">
      <div class="hd"><b>${p.t}</b>
        <div class="row" style="gap:8px"><span class="tagst ${p.s}">${this.stLabel(p.s)}</span><i>${p.got}/${p.max}</i></div>
      </div>
      <div class="q">${p.q}</div>
      ${this.trackHTML(p.pct*100,p.s,78)}
      <div class="ms">${p.msg}</div>
    </div>`).join('')}
    </div>
  </div>`;

  const numeros=`<div class="card" style="margin-bottom:14px">
    <div class="spread"><div class="lbl">Como está × como deveria estar</div>
      <span class="dimtxt" style="font-size:11px">${G.filter(g=>g.s==='ok').length}/${G.length} medidas no alvo</span></div>
    <div style="margin-top:4px">
    ${G.map(g=>`<div class="grow">
      <div class="gn"><b>${g.t}</b><em>${g.help}</em></div>
      <div class="gv"><span class="now">${g.disp}</span><span class="tg">alvo: ${g.tgtTxt}</span></div>
      <div class="gb">${this.trackHTML(g.pos,g.s,g.tpos,g.band?g.band.map(b=>b/g.max*100):null)}</div>
      <div class="gs"><span class="tagst ${g.s}">${this.stLabel(g.s)}</span></div>
    </div>`).join('')}
    </div>
  </div>`;

  const prioridades=`<div class="card" style="margin-bottom:14px">
    <div class="lbl">O que muda primeiro</div>
    <div style="margin-top:4px">
    ${pri.length? pri.map((i,k)=>`<div class="fixit">
      <div class="fxn">${k+1}</div>
      <div style="flex:1">
        <b>${esc(i.short)}</b>
        <div class="fxline">
          <span class="tagst ${i.s<=1?'hot':'warn'}">está</span> ${esc(i.ev)}
          <span style="opacity:.4">→</span>
          <span class="tagst ok">alvo</span> ${esc(i.tgt)}
        </div>
        <p><b>O que fazer:</b> ${esc(i.fix)}</p>
        <p class="sub"><b>Por que importa:</b> ${esc(i.why)}</p>
      </div>
    </div>`).join('') : '<p class="dimtxt" style="font-size:13px;margin-top:8px">Nenhum ponto abaixo do alvo. A peça está pronta.</p>'}
    </div>
  </div>`;

  const fortes=str.length?`<div class="card" style="margin-bottom:14px">
    <div class="lbl">O que já está funcionando</div>
    <ul style="list-style:none;margin-top:6px">
    ${str.map(i=>`<li style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span class="tagst ok">ok</span><span><b>${esc(i.short)}</b> — ${esc(i.up)}<br><span class="dimtxt" style="font-size:11.5px">${esc(i.ev)}</span></span></li>`).join('')}
    </ul></div>`:'';

  const leituras=`<div style="margin-bottom:14px">
    <div class="lbl" style="margin-bottom:9px">As três leituras que explicam a nota</div>
    <div class="tiles">
      <div class="tile"><div class="im"><canvas data-kind="original" data-slot="A" data-w="420"></canvas></div>
        <div class="cp"><b>A arte como ela é</b><span>Referência de comparação para as leituras ao lado.</span></div></div>
      <div class="tile"><div class="im"><canvas data-kind="calor" data-slot="A" data-w="420"></canvas></div>
        <div class="cp"><b>Para onde o olho vai</b><span>O amarelo é onde a atenção cai primeiro. Se ele estiver espalhado, ninguém sabe pra onde olhar.</span></div></div>
      <div class="tile"><div class="im"><canvas data-kind="fixacao" data-slot="A" data-w="420"></canvas></div>
        <div class="cp"><b>Em que ordem o olho lê</b><span>1, 2, 3: a sequência que o cérebro percorre no primeiro instante.</span></div></div>
      <div class="tile"><div class="im"><canvas data-kind="small" data-slot="A"></canvas></div>
        <div class="cp"><b>Tamanho real no feed</b><span>É assim que a maior parte do público vê. Se não funciona aqui, não funciona.</span></div></div>
    </div>

  const paleta=`<div class="card" style="margin-bottom:14px">
    <div class="lbl">Paleta dominante</div>
    <div class="sw" style="margin-top:8px">${A.palette.map(p=>`<div style="background:${p.hex}"><span>${Math.round(p.share*100)}%</span></div>`).join('')}</div>

  </div>`;

  return veredito + (B? this.abHTML(A,B,sc,scB) : '') + pilares + numeros + prioridades + fortes + leituras + paleta + this.manualCard();

manualCard(){
  const man=this.manual;
  return `<details class="fold" style="margin-bottom:14px">
    <summary>Ajustes manuais — 4 itens que nenhum algoritmo julga por você</summary>
    <div class="fb">
      <label class="f"><span class="lbl">Palavras no texto da thumb</span>

         <div class="row">${[0,1,2,3].map(v=>`<span class="chip b ${man[k]===v?'on':''}" onclick="Lab.setMan('${k}',${v})">${v}</span>`).join('')}</div></div>`).join('')}

/* ================= COMPARAÇÃO A × B ================= */
abHTML(A,B,sc,scB){
  const PA=this.pillarData(sc), PB=this.pillarData(scB);
  const d=scB.total-sc.total;
  const win = d>0? 'B' : d<0? 'A' : null;
  const ganhos=sc.items.map((i,k)=>({i, j:scB.items[k], d:scB.items[k].s-i.s})).filter(o=>o.d!==0);
  const up=ganhos.filter(o=>o.d>0), down=ganhos.filter(o=>o.d<0);

  const col=(res,slot,s,P,tag)=>`<div class="abcol">
    <div class="abh"><b>${tag} · ${esc(res.name||'sem nome')}</b>
      <span class="chip ${win===tag?'on':''}">${s.total}/36</span></div>
    <div class="abi"><canvas data-kind="original" data-slot="${slot}" data-w="520"></canvas></div>
    <div class="abb">
      ${P.map(p=>`<div style="margin-bottom:9px">
        <div class="spread" style="align-items:baseline"><span style="font-size:12.5px">${p.t}</span>
          <i style="font-style:normal;font-size:11.5px;color:var(--mute)">${p.got}/${p.max}</i></div>
        ${this.trackHTML(p.pct*100,p.s,78)}
      </div>`).join('')}
    </div>
  </div>`;

  return `<div style="margin-bottom:16px">
    <div class="lbl" style="margin-bottom:10px">Comparação lado a lado</div>
    <div class="abwin" style="border-left-color:${d>0?'var(--ok)':d<0?'var(--hot)':'var(--warn)'}">
      <b>${win? 'A versão '+win+' ganha por '+Math.abs(d)+' ponto'+(Math.abs(d)===1?'':'s') : 'Empate técnico'}</b>
      <p>${win==='B'
        ? 'O redesenho subiu a nota. Ganhou em: '+(up.map(o=>o.i.short).join(', ')||'—')+(down.length?'. Mas perdeu em: '+down.map(o=>o.i.short).join(', ')+'.':'.')
        : win==='A'
        ? 'A versão nova ficou abaixo da original. Perdeu em: '+(down.map(o=>o.i.short).join(', ')||'—')+(up.length?'. Ganhou em: '+up.map(o=>o.i.short).join(', ')+'.':'.')
        : 'As duas somam a mesma nota, mas por caminhos diferentes. Veja abaixo qual bloco cada uma resolve melhor.'}</p>
      <div class="row wrap" style="margin-top:10px;gap:7px">
        <button class="btn sm" onclick="Lab.promoteB()">Usar B como versão principal</button>
        <button class="btn sm ghost" onclick="Lab.dropB()">Remover B</button>
      </div>
    </div>
    <div class="abgrid">${col(A,'A',sc,PA,'A')}${col(B,'B',scB,PB,'B')}</div>
    ${ganhos.length?`<div class="card" style="margin-top:14px">
      <div class="lbl">O que mudou item a item</div>
      <table class="tbl" style="margin-top:8px"><thead><tr><th>Item</th><th>A</th><th>B</th><th>Δ</th><th>Medida A</th><th>Medida B</th></tr></thead><tbody>
      ${ganhos.map(o=>`<tr><td>${esc(o.i.short)}</td><td class="mono">${o.i.s}</td><td class="mono">${o.j.s}</td>
        <td class="mono" style="color:${o.d>0?'var(--ok)':'var(--hot)'}">${o.d>0?'+':''}${o.d}</td>
        <td class="dimtxt" style="font-size:11px">${esc(o.i.ev)}</td><td class="dimtxt" style="font-size:11px">${esc(o.j.ev)}</td></tr>`).join('')}
      </tbody></table></div>`:''}
  </div>`;
},

paintCanvas(){
  $$('#lab canvas[data-kind]').forEach(cv=>{
    const res = cv.dataset.slot==='B'? this.B : this.A; if(!res) return;
    const k=cv.dataset.kind;
    if(k==='small'){ this.drawSmall(res,cv); return; }
    if(k==='ctx'){ cv.width=100; cv.height=56; cv.getContext('2d').drawImage(res.c,0,0,100,56); return; }
    let w;
    if(cv.dataset.w==='fit'){ const par=cv.parentElement; w=Math.min(760,(par?par.clientWidth:700)-44); }
    else w=+cv.dataset.w||320;
    this.draw(k,res,cv,Math.max(80,w)/res.w);
  });
},

wire(id,slot){
  const el=$('#'+id); if(!el) return;
  el.onchange=async e=>{ const f=e.target.files[0]; if(!f)return;
    const img=await fileToImage(f); Lab.load(img,f.name.replace(/\.[^.]+$/,''),slot); };
  const d=$('#drop');
  if(d){
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};
    d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=async e=>{ e.preventDefault(); d.classList.remove('over');
      const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image')){
        const img=await fileToImage(f); Lab.load(img,f.name.replace(/\.[^.]+$/,''),'A'); } };
    d.onclick=e=>{ if(e.target===d) $('#fA').click(); };
  }
},
setMan(k,v){ this.manual[k]=v; this.render(); },

/* ---------- textos ---------- */
diagText(){
  const sc=this.score(this.A,this.manual);
  const l=[`ANÁLISE — ${this.A.name||'thumb'}`,`Nota: ${sc.total}/36`,''];
  sc.items.forEach(i=>l.push(`${String(i.n).padStart(2,'0')} ${i.l}: ${i.s}/3 — ${i.ev}`));
  l.push('','FRACO:');
  sc.items.filter(i=>i.s<=1).forEach(i=>l.push('· '+i.down+' ('+i.ev+')'));
  l.push('','FORTE:');
  sc.items.filter(i=>i.s>=3).forEach(i=>l.push('· '+i.up+' ('+i.ev+')'));
  l.push('',`Paleta: ${this.A.palette.map(p=>p.hex+' '+Math.round(p.share*100)+'%').join(' · ')}`);
  return l.join('\n');
},
resumoText(){
  const sc=this.score(this.A,this.manual), P=this.pillarData(sc), V=this.verdictText(sc.total);
  const scB=this.B? this.score(this.B,this.manual):null;
  const l=[];
  l.push(`ANÁLISE DE THUMBNAIL — ${this.meta.video||this.A.name||'thumb'}`);
  if(this.meta.cliente) l.push(`Cliente: ${this.meta.cliente}`);
  l.push(`Nota geral: ${sc.total}/36 — ${V.t}`);
  if(scB) l.push(`Versão B: ${scB.total}/36 (${scB.total-sc.total>=0?'+':''}${scB.total-sc.total})`);
  l.push('',V.p,'','OS 4 BLOCOS');
  P.forEach(p=>l.push(`· ${p.t}: ${p.got}/${p.max} — ${this.stLabel(p.s)}. ${p.msg}`));
  l.push('','COMO ESTÁ × COMO DEVERIA ESTAR');
  this.gauges(this.A).forEach(g=>l.push(`· ${g.t}: ${g.disp} (alvo: ${g.tgtTxt})`));
  const pri=this.priorities(sc);
  if(pri.length){
    l.push('','O QUE MUDA PRIMEIRO');
    pri.forEach((i,k)=>l.push(`${k+1}. ${i.short}\n   está: ${i.ev} | alvo: ${i.tgt}\n   fazer: ${i.fix}`));
  }
  const str=this.strengths(sc);
  if(str.length){ l.push('','JÁ ESTÁ FUNCIONANDO'); str.forEach(i=>l.push(`· ${i.short} — ${i.ev}`)); }
  if(this.meta.nota) l.push('','OBSERVAÇÃO',this.meta.nota);
  return l.join('\n');
},
copyDiag(){ copyText(this.diagText(),'Diagnóstico'); },
copyResumo(){ copyText(this.resumoText(),'Resumo'); },

/* ---------- histórico ---------- */
save(){
  const sc=this.score(this.A,this.manual);
  const scB=this.B? this.score(this.B,this.manual) : null;
  const an=DB.get(K.analyses,[]);
  const rec={
    id:this.curId||uid(), date:today(), name:this.A.name||'thumb',
    score:sc.total, items:sc.items.map(i=>({n:i.n,l:i.l,s:i.s,ev:i.ev})),
    thumb:this.A.dataUrl, palette:this.A.palette.map(p=>p.hex), refId:this.A.refId,
    manual:Object.assign({},this.manual), meta:Object.assign({},this.meta),
    thumbB:this.B? this.B.dataUrl:null, nameB:this.B? this.B.name:null,
    compare: scB? scB.total : null
  };
  const ix=an.findIndex(x=>x.id===rec.id);
  if(ix>=0){ rec.date=an[ix].date; an[ix]=rec; } else an.unshift(rec);
  this.curId=rec.id;
  DB.set(K.analyses,an);
  if(this.A.refId){
    const refs=DB.get(K.refs,[]); const r=refs.find(x=>x.id===this.A.refId);
    if(r){ r.score=sc.total; r.palette=this.A.palette.map(p=>p.hex); DB.set(K.refs,refs); }
  }
  renderBar(); this.render();
  toast(ix>=0?'Análise atualizada':'Análise salva no histórico');
},

async openAnalysis(id){
  const a=DB.get(K.analyses,[]).find(x=>x.id===id);
  if(!a) return toast('Análise não encontrada');
  if(!a.thumb) return toast('Essa análise foi salva sem imagem');
  toast('Reabrindo análise...');
  try{
    const imgA=await loadData(a.thumb);
    const rA=Eng.run(imgA); rA.name=a.name; rA.refId=a.refId||null; rA.dataUrl=a.thumb;
    let rB=null;
    if(a.thumbB){ const imgB=await loadData(a.thumbB); rB=Eng.run(imgB); rB.name=a.nameB||'versão B'; rB.dataUrl=a.thumbB; }
    this.manual=Object.assign({emo:2,comp:2,dif:2,cons:2,words:3}, a.manual||{});
    this.meta=Object.assign({cliente:'',video:'',nota:''}, a.meta||{});
    this.A=rA; this.B=rB; this.curId=a.id; this.mode='resumo'; this.tab='calor';
    go('mesa');
  }catch(e){ toast('Não consegui reabrir essa imagem'); }
},

evoSVG(vals){
  if(vals.length<2) return '';
  const w=600,h=66,p=6, n=vals.length;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(n-1), h-p-(v/36)*(h-2*p)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=d+` L${pts[n-1][0].toFixed(1)} ${h-p} L${pts[0][0].toFixed(1)} ${h-p} Z`;
  return `<svg class="evo" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${p}" y1="${(h-p-(28/36)*(h-2*p)).toFixed(1)}" x2="${w-p}" y2="${(h-p-(28/36)*(h-2*p)).toFixed(1)}" stroke="#332F3B" stroke-dasharray="4 4"></line>
    <path d="${area}" fill="#F2EDE710"></path>
    <path d="${d}" fill="none" stroke="#F2EDE7" stroke-width="1.6"></path>
    ${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.4" fill="#F2EDE7"></circle>`).join('')}
  </svg>`;
},

historico(){
  const an=DB.get(K.analyses,[]);
  const ord=[...an].reverse();
  paint(`<div class="head"><h1 class="h1">Histórico de análises</h1>
    <p>Toda análise salva reabre exatamente como estava na Mesa de luz — com mapa de calor, percurso, comparação A × B e relatório pronto para o cliente.</p></div>
  ${an.length?`
    <div class="card" style="margin-bottom:16px">
      <div class="spread"><div class="lbl">Evolução da nota</div>
        <div class="row wrap" style="gap:6px">
          <span class="chip">${an.length} análises</span>
          <span class="chip">média ${Math.round(an.reduce((a,x)=>a+x.score,0)/an.length)}/36</span>
          <span class="chip">últimas 10: ${Math.round(an.slice(0,10).reduce((a,x)=>a+x.score,0)/Math.min(10,an.length))}/36</span>
        </div></div>
      <div style="margin-top:10px">${this.evoSVG(ord.map(a=>a.score))||'<p class="dimtxt" style="font-size:12px">Salve pelo menos duas análises para ver a curva.</p>'}</div>
      <p class="dimtxt" style="font-size:11px;margin-top:6px">Linha tracejada = 28/36, o patamar em que a peça já está pronta para publicar.</p>
    </div>
    <div class="cards">${an.map(a=>`
      <div class="rcard">
        <img class="th" src="${a.thumb}" alt="" onclick="Lab.openAnalysis('${a.id}')">
        <div class="meta">
          <b onclick="Lab.openAnalysis('${a.id}')">${esc(a.name)}</b>
          <div class="row" style="margin-top:5px;gap:5px;flex-wrap:wrap">
            <span class="chip ${a.score>=28?'on':''}">${a.score}/36</span>
            ${a.compare!=null?`<span class="chip">B ${a.compare}/36</span>`:''}
            <span class="chip">${fmt(a.date)}</span></div>
          <div class="row" style="margin-top:8px;gap:6px">
            <button class="btn sm" onclick="Lab.openAnalysis('${a.id}')">Abrir</button>
            <button class="btn sm ghost" onclick="Lab.anDel('${a.id}')">Excluir</button>
          </div>
        </div>
      </div>`).join('')}</div>`
   :`<div class="empty"><b>Nenhuma análise salva</b>Rode a primeira na Mesa de luz.</div>`}`);
},
anDel(id){
  if(!confirm('Excluir esta análise?')) return;
  DB.set(K.analyses,DB.get(K.analyses,[]).filter(x=>x.id!==id));
  if(this.curId===id) this.curId=null;
  closeModal(); Lab.historico(); renderBar();
},

exportForm(){
  if(!this.A) return toast('Analise uma thumb primeiro');
  const m=this.meta;
  modal('Relatório para o cliente',`
    <div class="grid2">
      <label class="f"><span class="lbl">Cliente / canal</span><input type="text" id="ex_cli" value="${esc(m.cliente)}" placeholder="ex: Canal do Fulano"></label>
      <label class="f"><span class="lbl">Vídeo / peça</span><input type="text" id="ex_vid" value="${esc(m.video||this.A.name||'')}" placeholder="ex: Como sair das dívidas"></label>
    </div>
    <label class="f"><span class="lbl">Assinatura (você / estúdio)</span><input type="text" id="ex_by" value="${esc(S.name||'')}" placeholder="seu nome"></label>
    <label class="f"><span class="lbl">Observação sua (opcional — entra no relatório)</span>
      <textarea id="ex_note" placeholder="ex: entrego a versão corrigida até quinta">${esc(m.nota)}</textarea></label>
    <p class="dimtxt" style="font-size:12px">O relatório sai como um arquivo único, com as imagens embutidas. Abre em qualquer navegador e imprime em PDF direto pelo botão dentro dele.</p>`,
    `<button class="btn" onclick="Lab.copyResumoFromForm()">Copiar resumo em texto</button>
     <button class="btn" onclick="Lab.doExport('file')">Baixar arquivo</button>
     <button class="btn solid" onclick="Lab.doExport('open')">Abrir / imprimir PDF</button>`);
},
readForm(){
  const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
  this.meta={cliente:g('ex_cli'), video:g('ex_vid'), nota:g('ex_note')};
  const by=g('ex_by'); if(by!==undefined){ S.name=by; save(); }
  return by||S.name||'';
},
copyResumoFromForm(){ this.readForm(); copyText(this.resumoText(),'Resumo'); },
doExport(how){
  const by=this.readForm();
  const html=this.buildReport(by);
  closeModal();
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const slug=(this.meta.cliente||this.meta.video||this.A.name||'thumb').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  if(how==='open'){
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download='analise-'+slug+'-'+today()+'.html'; a.click(); toast('Bloqueio de pop-up — baixei o arquivo'); }
    else toast('Relatório aberto em nova aba');
  }else{
    const a=document.createElement('a'); a.href=url; a.download='analise-'+slug+'-'+today()+'.html'; a.click();
    toast('Relatório baixado');
  }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
},

buildReport(by){
  const A=this.A, B=this.B, man=this.manual;
  const sc=this.score(A,man), scB=B? this.score(B,man):null;
  const P=this.pillarData(sc), G=this.gauges(A), V=this.verdictText(sc.total);
  const pri=this.priorities(sc), str=this.strengths(sc), risk=this.riskLine(P);
  const m=this.meta;
  const d=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

  const imgA=this.shot(A,'original',720), calA=this.shot(A,'calor',620),
        fixA=this.shot(A,'fixacao',620), smA=this.shot(A,'small');
  const arc=(v,max,size)=>{
    const p=Math.max(0,Math.min(1,v/max)), r=size/2-9, c=2*Math.PI*r;
    const col=p>=.78?'#2E8B57':p>=.5?'#B8860B':'#C0442E';
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E7E2DB" stroke-width="10"></circle>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${(c*p).toFixed(1)} ${(c+1).toFixed(1)}"></circle></svg>`;
  };
  const bar=(pct,s,tpos,band)=>{
    let marks = band? band.map(b=>`<span class="tg" style="left:${b}%"></span>`).join('')
              : (tpos!=null? `<span class="tg" style="left:${tpos}%"></span>`:'');
    return `<div class="bar"><i class="s-${s}" style="width:${Math.max(2,Math.min(100,pct))}%"></i>${marks}</div>`;
  };
  const lab=s=> s==='ok'?'no alvo' : s==='warn'?'quase lá' : 'fora do alvo';

  const abBlock = B? (()=>{
    const PB=this.pillarData(scB), delta=scB.total-sc.total;
    const imgB=this.shot(B,'original',560), imgA2=this.shot(A,'original',560);
    const calB=this.shot(B,'calor',560), calA2=this.shot(A,'calor',560);
    const ganhos=sc.items.map((i,k)=>({i,j:scB.items[k],d:scB.items[k].s-i.s})).filter(o=>o.d!==0);
    return `<section class="nb">
      <h2>Comparação lado a lado</h2>
      <p class="lead">${delta>0?'A versão B sobe '+delta+' ponto'+(delta===1?'':'s')+' em relação à original.'
        : delta<0?'A versão B fica '+Math.abs(delta)+' ponto'+(Math.abs(delta)===1?'':'s')+' abaixo da original.'
        : 'As duas versões somam a mesma nota, por caminhos diferentes.'}</p>
      <div class="ab">
        <div class="abc"><div class="abt">A · ${esc(A.name||'original')} <b>${sc.total}/36</b></div>
          <img src="${imgA2}"><img src="${calA2}">
          ${P.map(p=>`<div class="abr"><span>${p.t}</span><em>${p.got}/${p.max}</em>${bar(p.pct*100,p.s,78)}</div>`).join('')}</div>
        <div class="abc"><div class="abt">B · ${esc(B.name||'nova versão')} <b>${scB.total}/36</b></div>
          <img src="${imgB}"><img src="${calB}">
          ${PB.map(p=>`<div class="abr"><span>${p.t}</span><em>${p.got}/${p.max}</em>${bar(p.pct*100,p.s,78)}</div>`).join('')}</div>
      </div>
      ${ganhos.length?`<table class="t"><thead><tr><th>O que mudou</th><th>A</th><th>B</th><th>Δ</th></tr></thead><tbody>
        ${ganhos.map(o=>`<tr><td>${esc(o.i.short)}<em>${esc(o.i.ev)} → ${esc(o.j.ev)}</em></td>
          <td class="n">${o.i.s}</td><td class="n">${o.j.s}</td>
          <td class="n" style="color:${o.d>0?'#2E8B57':'#C0442E'}">${o.d>0?'+':''}${o.d}</td></tr>`).join('')}
      </tbody></table>`:''}
    </section>`;
  })() : '';

  return `<!doctype html>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Análise de thumbnail — ${esc(m.cliente||m.video||A.name||'')}</title>

  .gr{grid-template-columns:1fr;gap:6px}
  .gr .st{text-align:left}
  .views,.ab{grid-template-columns:1fr}
}
</style></head><body>
<div class="tools"><span>Relatório pronto — use o botão para salvar em PDF</span><button onclick="window.print()">Imprimir / salvar PDF</button></div>
<div class="doc">
  <header>
    <div class="k">Análise de thumbnail</div>
    <h1>${esc(m.video||A.name||'Thumbnail')}</h1>
    <div class="meta">${m.cliente?esc(m.cliente)+' · ':''}${d}${by?' · por '+esc(by):''}</div>
  </header>

  <div class="hero">
    <div class="g">${arc(sc.total,36,126)}<div><b>${sc.total}</b><span>de 36</span></div></div>
    <div>
      <span class="tag ${V.s}">${V.t}</span>
      ${scB?`<span class="tag ${scB.total>sc.total?'ok':scB.total<sc.total?'hot':'warn'}" style="margin-left:6px">versão B: ${scB.total}/36</span>`:''}
      <h2 style="margin:10px 0 6px">Nota geral ${sc.total} de 36</h2>
      <p>${V.p}</p>
      <div class="chips">
        <span>risco de passar batido: <b>${risk.v}</b></span>
        <span>${P.filter(p=>p.s==='ok').length} de 4 blocos no alvo</span>
        <span>${G.filter(g=>g.s==='ok').length} de ${G.length} medidas no alvo</span>
      </div>
      <p style="font-size:13px;margin-top:10px;color:#6B6660">${risk.p}</p>
    </div>
  </div>

  <div class="shot"><img src="${imgA}" alt=""></div>

  <section class="nb">
    <h2>Os 4 blocos que decidem o clique</h2>
    <p class="lead">Cada bloco reúne três medidas. A marca escura na barra é o mínimo aceitável.</p>
    ${P.map(p=>`<div class="p">
      <div class="h"><b>${p.t}</b><span><span class="tag ${p.s}">${lab(p.s)}</span> <em>${p.got}/${p.max}</em></span></div>
      <div class="q">${p.q}</div>
      ${bar(p.pct*100,p.s,78)}
      <div class="m">${p.msg}</div></div>`).join('')}
  </section>

  <section class="nb">
    <h2>Como está × como deveria estar</h2>
    <p class="lead">Os números medidos na sua arte, ao lado da faixa que funciona no feed do YouTube.</p>
    ${G.map(g=>`<div class="gr">
      <div><b>${g.t}</b><em>${g.help}</em></div>
      <div><span class="now">${g.disp}</span><span class="alv">alvo: ${g.tgtTxt}</span></div>
      <div class="bw">${bar(g.pos,g.s,g.tpos,g.band?g.band.map(b=>b/g.max*100):null)}</div>
      <div class="st"><span class="tag ${g.s}">${lab(g.s)}</span></div>
    </div>`).join('')}
  </section>

  ${pri.length?`<section class="nb"><h2>O que muda primeiro</h2>
    <p class="lead">Em ordem de impacto. Resolver estes três é o que mais mexe no clique.</p>
    ${pri.map((i,k)=>`<div class="fx"><div class="n">${k+1}</div><div>
      <b>${esc(i.short)}</b>
      <div class="line"><b>Está:</b> ${esc(i.ev)} &nbsp;·&nbsp; <b>Alvo:</b> ${esc(i.tgt)}</div>
      <p><b>O que fazer:</b> ${esc(i.fix)}</p>
      <p class="s"><b>Por que importa:</b> ${esc(i.why)}</p>
    </div></div>`).join('')}</section>`:''}

  ${str.length?`<section class="nb"><h2>O que já está funcionando</h2>
    <ul class="ok">${str.map(i=>`<li><span class="tag ok">ok</span><span><b>${esc(i.short)}</b> — ${esc(i.up)}<em>${esc(i.ev)}</em></span></li>`).join('')}</ul></section>`:''}

  <section class="nb">
    <h2>As leituras que explicam a nota</h2>
    <div class="views">
      <div class="view"><div class="i"><img src="${calA}"></div>
        <div class="c"><b>Para onde o olho vai</b><span>As áreas mais claras são as que capturam a atenção primeiro. Espalhado demais significa que não existe um ponto de entrada.</span></div></div>
      <div class="view"><div class="i"><img src="${fixA}"></div>
        <div class="c"><b>Em que ordem o olho lê</b><span>A sequência 1, 2, 3 que o cérebro percorre nos primeiros décimos de segundo, antes de qualquer leitura consciente.</span></div></div>
      <div class="view"><div class="i"><img src="${smA}" style="image-rendering:auto"></div>
        <div class="c"><b>Tamanho real no feed</b><span>168 pixels de largura. É assim que a maior parte do público vê a sua thumb — nunca em tela cheia.</span></div></div>
      <div class="view"><div class="i" style="background:#fff;padding:14px"><div style="width:100%">
        ${A.palette.map(p=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="width:22px;height:22px;background:${p.hex};border-radius:3px;display:block;border:1px solid #0001"></span><span style="font-size:12px;color:#4A4640">${p.hex} · ${Math.round(p.share*100)}%</span></div>`).join('')}
      </div></div>
        <div class="c"><b>Paleta dominante</b><span>${Math.round(A.warm*100)}% da área em tons quentes. Saturação média de ${(A.m.satMean*100).toFixed(0)}%.</span></div></div>
    </div>
  </section>

  ${abBlock}

  ${m.nota?`<div class="note"><b>Observação</b><br>${esc(m.nota).replace(/\n/g,'<br>')}</div>`:''}

  <footer>
    Como a nota é montada: doze critérios, cada um de 0 a 3, somando 36. Oito são medidos automaticamente a partir da imagem — saliência visual, percurso de fixação, separação de planos, disciplina de cor e sobrevivência à redução para 168 px. Quatro dependem de julgamento humano: emoção legível, relação entre texto e título, diferenciação frente aos concorrentes e consistência com o sistema do canal.<br><br>
    O modelo de atenção usado aqui prevê o comportamento reflexo do olho no primeiro décimo de segundo. Não substitui teste com público real, mas é exatamente nessa janela que a thumbnail ganha ou perde o clique.
    ${by?'<br><br>Análise por '+esc(by)+'.':''}
  </footer>
</div>
</body></html>`;
},

metodo(){
  paint(`<div class="head"><h1 class="h1">Método e ficha</h1>
    <p>O que o sistema mede, como mede e por que cada medida importa. Quatro itens continuam manuais de propósito — são julgamentos que nenhum algoritmo faz por você.</p></div>
  <div class="card" style="margin-bottom:16px">
    <div class="lbl">Como os 12 itens viram 4 blocos</div>
    <table class="tbl" style="margin-top:8px"><thead><tr><th>Bloco</th><th>Pergunta que ele responde</th><th>Itens</th></tr></thead><tbody>
    ${this.PILLARS.map(p=>`<tr><td><b>${p.t}</b></td><td class="dimtxt">${p.q}</td><td class="mono">${p.items.map(n=>String(n).padStart(2,'0')).join(' · ')}</td></tr>`).join('')}
    </tbody></table>
    <p class="dimtxt" style="font-size:12px;margin-top:12px">Cada bloco vale 9 pontos. O cliente lê os quatro blocos; você lê os doze itens.</p>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="lbl">Como o mapa de calor é gerado</div>
    <ol style="margin:10px 0 0 16px;font-size:13px;line-height:1.75">
      <li><b>Intensidade</b> — diferenças centro-entorno de luminância em três escalas. É o que detecta contraste local, o gatilho mais forte de fixação.</li>
      <li><b>Oponência de cor</b> — canais vermelho-verde e azul-amarelo, também em centro-entorno. É como o sistema visual humano codifica cor.</li>
      <li><b>Orientação</b> — energia de borda por Sobel, depois centro-entorno. Detecta estrutura, texto e recorte.</li>
      <li><b>Combinação</b> — 42% intensidade, 30% cor, 28% orientação, com viés central leve, porque o olho e o enquadramento do YouTube favorecem o centro.</li>
      <li><b>Percurso</b> — picos sucessivos com inibição de retorno: acha o mais forte, apaga a vizinhança, repete. É o modelo clássico de sequência de fixação.</li>
    </ol>
    <p class="dimtxt" style="font-size:12px;margin-top:12px">É um modelo de saliência bottom-up. Ele prevê para onde o olho vai por reflexo, antes de qualquer interpretação. Não substitui eye-tracking com pessoas, mas prevê bem o primeiro décimo de segundo — que é exatamente onde a thumb ganha ou perde.</p>
  </div>
  <div class="card" style="margin-bottom:16px">
    <div class="lbl">Os quatro testes manuais que você continua fazendo</div>
    <ol style="margin:10px 0 0 16px;font-size:13px;line-height:1.75">
      <li><b>Emoção legível</b> — choque, riso aberto, raiva e desprezo sobrevivem a 168px. Reflexão, ceticismo e preocupação leve não.</li>
      <li><b>Texto complementa o título</b> — exige ler o título. Título fala A, thumb fala B.</li>
      <li><b>Diferenciação no sugerido</b> — monte uma grade com 11 concorrentes reais mais a sua. Olhe 2 segundos e desvie. Qual você lembra?</li>
      <li><b>Consistência com o sistema</b> — a peça pertence ao mesmo canal das anteriores?</li>
    </ol>
  </div>
  <div class="card">
    <div class="lbl">Faixas de referência</div>
    <table class="tbl" style="margin-top:8px"><thead><tr><th>Medida</th><th>3 pontos</th><th>0 ponto</th><th>Por quê</th></tr></thead><tbody>
      ${[['Razão pico 1 / pico 2','≥ 1,55×','< 1,12×','Um destino claro para a primeira fixação'],
         ['Energia de borda a 168px','≥ 70%','< 42%','A estrutura precisa sobreviver à redução'],
         ['Separação de luminância','≥ 22%','< 7%','Descolar por luz funciona sem depender de cor'],
         ['Distância de matiz','≥ 70°','< 20°','Quente contra frio é o par mais eficiente'],
         ['Área em alta saturação','≤ 10%','> 30%','Acento que ocupa tudo deixa de ser acento'],
         ['Massas salientes','≤ 2','≥ 5','Sujeito, texto, contexto — o quarto elemento custa CTR'],
         ['Deslocamento em cinza','≤ 7%','> 28%','Se a cor sai e o foco muda, a luz não estava fazendo o trabalho']]
        .map(r=>`<tr><td><b>${r[0]}</b></td><td class="mono">${r[1]}</td><td class="mono">${r[2]}</td><td class="dimtxt">${r[3]}</td></tr>`).join('')}
    </tbody></table>
  </div>`);
}
};

/* ============================================================
   backup, atalhos, inicialização
   ============================================================ */
const App={
  async exportAll(){
    const dump={v:1,date:new Date().toISOString()};
    for(const k of Object.values(K)) if(typeof k==='string') dump[k]=DB.get(k,null);
    const blob=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='thumb-os-'+today()+'.json'; a.click();
    toast('Backup exportado');
  },
  importAll(){
    const i=document.createElement('input'); i.type='file'; i.accept='application/json';
    i.onchange=e=>{
      const f=e.target.files[0]; if(!f)return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const d=JSON.parse(r.result);
          Object.values(K).forEach(k=>{ if(typeof k==='string' && d[k]!==undefined) DB.set(k,d[k]); });
          DB.flush().then(()=>{ S=DB.get(K.state,S); toast('Backup importado'); go('hoje'); });
        }catch(err){ toast('Arquivo inválido'); }
      };
      r.readAsText(f);
    };
    i.click();
  }
};

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(e.key==='n'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); Brain.noteForm(); }
  if(e.key==='r'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); Brain.refForm(); }
  if(e.key==='m'&&!e.metaKey&&!e.ctrlKey){ e.preventDefault(); go('mesa'); }
  if(e.key==='Escape') closeModal();
});
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==CUR) go(h); });
window.addEventListener('beforeunload',()=>DB.flush());

boot().catch(e=>{
  $('#view').innerHTML='<div class="empty"><b>Falha ao iniciar</b>'+esc(e.message)+'</div>';
});
</script>
</body>
</html>
